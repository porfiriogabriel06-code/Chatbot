<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatBot de Reclutamiento</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-soft: #1e293b;
      --accent: #38bdf8;
      --accent-dark: #0ea5e9;
      --text: #e2e8f0;
      --text-soft: #94a3b8;
      --border: rgba(148, 163, 184, 0.16);
      --shadow: 0 24px 80px rgba(15, 23, 42, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top, rgba(56, 189, 248, 0.15), transparent 25%),
                  linear-gradient(180deg, #020617 0%, #0f172a 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .chat-shell {
      width: min(100%, 960px);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      min-height: 720px;
    }

    .chat-header {
      padding: 24px 28px;
      background: linear-gradient(90deg, rgba(56, 189, 248, .16), rgba(255, 255, 255, 0.03));
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .chat-title {
      display: grid;
      gap: 6px;
    }

    .chat-title h1 {
      margin: 0;
      font-size: 1.7rem;
      letter-spacing: -0.02em;
    }

    .chat-title p {
      margin: 0;
      color: var(--text-soft);
      font-size: 0.97rem;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      font-weight: 600;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.16);
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 0.92rem;
    }

    .status-badge::before {
      content: '';
      width: 10px;
      height: 10px;
      background: #22c55e;
      border-radius: 999px;
      display: inline-block;
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.12);
    }

    .progress-panel {
      padding: 16px 24px;
      display: grid;
      gap: 12px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      opacity: 0;
      transform: translateY(-12px);
      transition: opacity 0.35s ease, transform 0.35s ease, height 0.35s ease;
      pointer-events: none;
      height: 0;
      overflow: hidden;
    }

    .progress-panel.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
      height: auto;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .progress-title {
      font-size: 0.98rem;
      font-weight: 700;
    }

    .progress-subtitle {
      color: var(--text-soft);
      font-size: 0.9rem;
    }

    .progress-bar-wrapper {
      display: grid;
      gap: 10px;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.16);
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #38bdf8, #0ea5e9);
      transition: width 0.35s ease;
    }

    .progress-steps {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .progress-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
      min-width: 0;
      width: 20%;
    }

    .progress-step .step-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(148, 163, 184, 0.4);
      transition: all 0.28s ease;
    }

    .progress-step.completed .step-dot {
      background: #22c55e;
      transform: scale(1.05);
      box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.08);
    }

    .progress-step span {
      color: var(--text-soft);
      font-size: 0.82rem;
      line-height: 1.3;
      white-space: normal;
    }

    .file-upload-button.hidden {
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
    }

    .file-upload-button.visible {
      opacity: 1;
      transform: translateY(0);
      animation: glow-appear 0.6s ease forwards;
    }

    .file-upload-button.file-uploading {
      transform: translateY(0) scale(0.98);
      box-shadow: 0 10px 30px rgba(56,189,248,0.12);
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 6px 20px rgba(56,189,248,0.06); }
      50% { box-shadow: 0 16px 40px rgba(56,189,248,0.12); }
      100% { box-shadow: 0 6px 20px rgba(56,189,248,0.06); }
    }

    @keyframes glow-appear {
      0% {
        box-shadow: 0 0 0 0 rgba(56, 189, 248, 0);
      }
      100% {
        box-shadow: 0 0 0 12px rgba(56, 189, 248, 0.08);
      }
    }

    .chat-container {
      padding: 24px;
      display: grid;
      gap: 18px;
      overflow-y: auto;
      min-height: 320px;
    }

    .message {
      max-width: 78%;
      padding: 18px 20px;
      border-radius: 20px;
      line-height: 1.6;
      font-size: 0.98rem;
      box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.06);
    }

    .message.bot {
      background: rgba(148, 163, 184, 0.08);
      border-top-left-radius: 4px;
      justify-self: start;
    }

    .message.user {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.16), rgba(59, 130, 246, 0.16));
      border-top-right-radius: 4px;
      justify-self: end;
    }

    .interactive-buttons {
      padding: 0 24px 18px 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: flex-start;
      min-height: 76px;
    }

    .interactive-button {
      padding: 14px 20px;
      border: 1.5px solid rgba(56, 189, 248, 0.24);
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.12), rgba(59, 130, 246, 0.08));
      color: var(--text);
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.25s ease;
      font-weight: 600;
      font-size: 0.95rem;
      white-space: nowrap;
    }

    .interactive-button:hover {
      transform: translateY(-2px);
      border-color: rgba(56, 189, 248, 0.4);
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(59, 130, 246, 0.16));
      box-shadow: 0 14px 32px rgba(56, 189, 248, 0.16);
    }

    .file-input-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .file-upload-button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 20px;
      border: 1px solid rgba(56, 189, 248, 0.2);
      background: rgba(56, 189, 248, 0.12);
      color: var(--text);
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.25s ease;
    }

    .file-upload-button:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: rgba(56, 189, 248, 0.4);
    }

    .file-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    #file-input {
      display: none;
    }

    .chat-footer {
      padding: 20px 24px;
      border-top: 1px solid var(--border);
      display: grid;
      gap: 12px;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(14px);
    }

    .footer-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
    }

    .chat-footer input[type='text'] {
      width: 100%;
      padding: 16px 18px;
      border-radius: 16px;
      border: 1px solid rgba(148, 163, 184, 0.12);
      background: #0f172a;
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    .chat-footer button.send-button {
      min-width: 120px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #0f172a;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .chat-footer button.send-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 40px rgba(56, 189, 248, 0.2);
    }

    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 8px 0;
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      background: rgba(56, 189, 248, 0.6);
      border-radius: 50%;
      animation: typing 1.4s infinite;
    }

    .typing-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typing {
      0%, 60%, 100% {
        opacity: 0.5;
        transform: translateY(0);
      }
      30% {
        opacity: 1;
        transform: translateY(-10px);
      }
    }

    @media (max-width: 720px) {
      .chat-shell {
        min-height: 100vh;
        width: 100%;
        border-radius: 24px;
      }

      .chat-header,
      .progress-panel,
      .chat-container,
      .interactive-buttons,
      .chat-footer {
        padding-left: 18px;
        padding-right: 18px;
      }

      .chat-footer {
        padding-bottom: 28px;
      }
    }
  </style>
</head>
<body>
  <section class="chat-shell">
    <header class="chat-header">
      <div class="chat-title">
        <h1>J&S FORCE TRUCKS </h1>
        <p>Chatbot de Reclutamiento</p>
      </div>
      <div>
        <div class="status-badge">
          En línea • <span id="current-time">00:00</span>
        </div>
        <p class="small-label" id="current-date">Fecha</p>
      </div>
    </header>

    <div class="progress-panel" id="progress-panel">
      <div class="progress-header">
        <div>
          <div class="progress-title">Estado de tu postulación</div>
          <div class="progress-subtitle">Progreso fluido y guía paso a paso.</div>
        </div>
        <div class="small-label">Actualiza automáticamente</div>
      </div>
      <div class="progress-bar-wrapper">
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-steps" id="progress-steps"></div>
      </div>
    </div>

    <div class="chat-container" id="chat-container"></div>

    <div class="interactive-buttons" id="interactive-buttons" aria-live="polite"></div>

    <div class="chat-footer">
      <div class="footer-row">
        <input
          id="message-input"
          type="text"
          placeholder="Escribe tu mensaje..."
          aria-label="Escribe tu mensaje"
          autocomplete="off"
        />
        <button id="send-button" class="send-button" type="button">Enviar</button>
      </div>
      <div class="file-input-wrapper">
        <button id="upload-button" class="file-upload-button hidden" type="button">
          Adjuntar CV (PDF)
        </button>
        <input type="file" id="file-input" accept="application/pdf" aria-label="Cargar archivo PDF" />
      </div>
    </div>
  </section>

  <input type="hidden" id="max-upload-bytes" value="{{ max_upload_bytes }}" />

  <script>
    const chatContainer = document.getElementById('chat-container');
    const messageInput = document.getElementById('message-input');
    const sendButton = document.getElementById('send-button');
    const currentTime = document.getElementById('current-time');
    const currentDate = document.getElementById('current-date');
    const interactiveButtons = document.getElementById('interactive-buttons');
    const progressPanel = document.getElementById('progress-panel');
    const progressFill = document.getElementById('progress-fill');
    const progressSteps = document.getElementById('progress-steps');
    const fileInput = document.getElementById('file-input');
    const uploadButton = document.getElementById('upload-button');
    const maxUploadBytesInput = document.getElementById('max-upload-bytes');

    const BOT_NAME = 'DOT';
    const MAX_UPLOAD_BYTES = Number(maxUploadBytesInput.value);
    let uploadInProgress = false;
    let inactivityTimer = null;
    let conversationState = {
      selected_area: null,
      selected_position: null,
      selected_vacante_id: null,
      step: null,
      interview_question_index: null,
      interviewAnswers: [],
      interview_score: null,
      candidateName: null,
      cvUploaded: false,
      cvFileId: null,
      cvFilePath: null,
      emailSent: false,
      inactivityNotified: false
    };

    const inactivityMessages = [
      '¿Sigues ahí? 😊',
      'Podemos continuar tu proceso cuando quieras.',
      'Si necesitas más tiempo, aquí estaré para ayudarte.'
    ];

    function updateDateTime() {
      const now = new Date();
      const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      currentDate.textContent = now.toLocaleDateString('es-ES', dateOptions);
      currentTime.textContent = now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    }

    function appendMessage(text, sender) {
      const messageEl = document.createElement('div');
      messageEl.classList.add('message', sender);
      if (sender === 'bot') {
        const safeText = text.replace(/\n/g, '<br />');
        messageEl.innerHTML = `
          <strong>${BOT_NAME}</strong><br />
          ${safeText}
        `;
      } else {
        messageEl.innerHTML = `<strong>Tú</strong><br />`;
        messageEl.appendChild(document.createTextNode(text));
      }
      chatContainer.appendChild(messageEl);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function showTypingIndicator() {
      const existing = document.getElementById('typing-indicator');
      if (existing) return;
      const messageEl = document.createElement('div');
      messageEl.classList.add('message', 'bot');
      messageEl.id = 'typing-indicator';
      messageEl.innerHTML = `
        <strong>${BOT_NAME}</strong><br />
        <div class="typing-indicator">
          <span class="typing-dot"></span>
          <span class="typing-dot"></span>
          <span class="typing-dot"></span>
        </div>
      `;
      chatContainer.appendChild(messageEl);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function removeTypingIndicator() {
      const indicator = document.getElementById('typing-indicator');
      if (indicator) indicator.remove();
    }

    function showInteractiveButtons(options) {
      interactiveButtons.innerHTML = '';
      options.forEach((option) => {
        const button = document.createElement('button');
        button.className = 'interactive-button';
        button.type = 'button';
        button.textContent = option.label;
        button.addEventListener('click', () => handleButtonClick(option.value, option.label));
        interactiveButtons.appendChild(button);
      });
    }

    function clearInteractiveButtons() {
      interactiveButtons.innerHTML = '';
    }

    function showFileUploadButton() {
      clearInteractiveButtons();
      setUploadButtonVisible(true);
    }

    function setUploadButtonVisible(show) {
      if (show) {
        uploadButton.classList.remove('hidden');
        uploadButton.classList.add('visible');
      } else {
        uploadButton.classList.remove('visible');
        uploadButton.classList.add('hidden');
      }
    }

    function handleButtonClick(value, label) {
      appendMessage(label, 'user');
      clearInteractiveButtons();
      resetInactivityTimer();
      sendToBackend(value);
    }

    function resetInactivityTimer() {
      if (inactivityTimer) {
        clearTimeout(inactivityTimer);
      }
      conversationState.inactivityNotified = false;
      inactivityTimer = setTimeout(() => {
        if (!conversationState.inactivityNotified) {
          const message = inactivityMessages[Math.floor(Math.random() * inactivityMessages.length)];
          appendMessage(message, 'bot');
          conversationState.inactivityNotified = true;
        }
      }, 90000);
    }

    function renderProgress() {
      const thirdLabel = conversationState.step === 'cv_upload'
        ? 'CV adjunto'
        : conversationState.step === 'interview'
          ? 'Entrevista'
          : 'Entrevista / CV';

      const thirdCompleted = conversationState.step === 'cv_upload' || conversationState.step === 'completed';

      const steps = [
        {
          key: 'areaSelected',
          label: 'Área',
          description: conversationState.selected_area || 'Aún no seleccionada',
          completed: !!conversationState.selected_area
        },
        {
          key: 'positionSelected',
          label: 'Puesto',
          description: conversationState.selected_position || 'Aún no definido',
          completed: !!conversationState.selected_position
        },
        {
          key: 'thirdStep',
          label: thirdLabel,
          description: conversationState.step === 'cv_upload'
            ? (conversationState.cvUploaded ? 'CV recibido' : 'Pendiente')
            : (conversationState.step === 'interview' ? 'En progreso' : 'Pendiente'),
          completed: thirdCompleted
        },
        {
          key: 'finalStep',
          label: 'Finalización',
          description: conversationState.emailSent ? 'Enviado' : 'Pendiente',
          completed: !!conversationState.emailSent
        }
      ];

      const completedCount = steps.filter((step) => step.completed).length;
      const progressPercent = Math.round((completedCount / steps.length) * 100);

      if (progressFill) {
        progressFill.style.width = `${progressPercent}%`;
      }

      progressSteps.innerHTML = steps.map((step) => {
        return `
          <div class="progress-step ${step.completed ? 'completed' : ''}" title="${step.description}">
            <div class="step-dot"></div>
            <span>${step.label}</span>
          </div>
        `;
      }).join('');
    }

    async function uploadCV(file) {
      if (uploadInProgress) return;
      uploadInProgress = true;
      disableUIDuringUpload(true);

      appendMessage('Validando archivo...', 'bot');
      const formData = new FormData();
      formData.append('file', file);
      formData.append('state', JSON.stringify(conversationState));

      showTypingIndicator();
      try {
        appendMessage('Procesando información...', 'bot');
        const response = await fetch('/upload-cv', {
          method: 'POST',
          body: formData
        });
        const data = await response.json();
        removeTypingIndicator();

        appendMessage(data.response, 'bot');

        if (data.stateUpdates) {
          updateConversationState(data.stateUpdates);
        }
        // ocultar el botón de adjuntar después
        setUploadButtonVisible(false);
      } catch (error) {
        removeTypingIndicator();
        appendMessage('No fue posible enviar tu CV en este momento. Por favor intenta nuevamente.', 'bot');
        console.error(error);
      } finally {
        uploadInProgress = false;
        disableUIDuringUpload(false);
      }
    }

    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (!file) return;
      if (uploadInProgress) {
        appendMessage('Ya hay una carga en curso. Espera por favor.', 'bot');
        fileInput.value = '';
        return;
      }
      // Validar tipo
      if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
        appendMessage('Solo se permiten archivos PDF. Por favor selecciona un PDF.', 'bot');
        fileInput.value = '';
        return;
      }
      // Validar tamaño (cliente)
      if (file.size > MAX_UPLOAD_BYTES) {
        const mb = Math.round(MAX_UPLOAD_BYTES / (1024 * 1024));
        appendMessage(`El archivo supera el tamaño máximo permitido (${mb} MB).`, 'bot');
        fileInput.value = '';
        return;
      }

      appendMessage(`Archivo: ${file.name}`, 'user');
      uploadCV(file);
      fileInput.value = '';
    });

    function disableUIDuringUpload(disabled) {
      uploadButton.disabled = disabled;
      sendButton.disabled = disabled;
      if (disabled) {
        uploadButton.classList.add('file-uploading');
      } else {
        uploadButton.classList.remove('file-uploading');
      }
    }

    function showNewApplicationButton() {
      // Añadir botón de reinicio visible
      const existing = document.getElementById('new-application-button');
      if (existing) return;
      const btn = document.createElement('button');
      btn.id = 'new-application-button';
      btn.className = 'interactive-button';
      btn.type = 'button';
      btn.textContent = ' Nueva postulación';
      btn.addEventListener('click', resetConversation);
      interactiveButtons.appendChild(btn);
    }

    async function resetConversation() {
      try {
        appendMessage('Reiniciando postulación...', 'bot');
        const res = await fetch('/restart', { method: 'POST' });
        const data = await res.json();
        // limpiar estado en cliente
        conversationState = {
          selected_area: null,
          selected_position: null,
          selected_vacante_id: null,
          step: null,
          interview_question_index: null,
          interviewAnswers: [],
          interview_score: null,
          candidateName: null,
          cvUploaded: false,
          cvFileId: null,
          cvFilePath: null,
          emailSent: false,
          inactivityNotified: false
        };
        // limpiar UI
        interactiveButtons.innerHTML = '';
        chatContainer.innerHTML = '';
        progressPanel.classList.remove('visible');
        setUploadButtonVisible(false);
        showInitialGreeting();
      } catch (err) {
        appendMessage('No fue posible reiniciar la conversación. Intenta nuevamente.', 'bot');
      }
    }

    uploadButton.addEventListener('click', () => {
      fileInput.click();
    });

    function updateConversationState(updates) {
      conversationState = { ...conversationState, ...updates };
      if (conversationState.selected_area || conversationState.step) {
        progressPanel.classList.add('visible');
      }
      renderProgress();
      resetInactivityTimer();
      // Mostrar botón de nueva postulación cuando el proceso terminó
      if (conversationState.emailSent || conversationState.step === 'completed') {
        showNewApplicationButton();
      }
    }

    function showInitialGreeting() {
      appendMessage(
        'Hola. Soy el asistente virtual de reclutamiento. Puedo ayudarte con vacantes, postulaciones y procesos de selección.',
        'bot'
      );
      setTimeout(() => {
        showDefaultActions();
      }, 450);
    }

    function handleBotResponse(response, result) {
      setUploadButtonVisible(false);

      if (result && result.show_upload_button) {
        setUploadButtonVisible(true);
      }

      if (result && result.redirect_to_admin && result.redirect_url) {
        setTimeout(() => {
          window.location.href = result.redirect_url;
        }, 700);
        return;
      }

      if (result && Array.isArray(result.buttons) && result.buttons.length > 0) {
        showInteractiveButtons(result.buttons);
        return;
      }
    }

    async function sendToBackend(message) {
      showTypingIndicator();
      try {
        const response = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, state: conversationState })
        });
        const data = await response.json();
        removeTypingIndicator();

        appendMessage(data.response, 'bot');

        if (data.next_state) {
          updateConversationState(data.next_state);
        }

        if (data.stateUpdates) {
          updateConversationState(data.stateUpdates);
        }

        if (data.email_status && data.email_status.message) {
          appendMessage(data.email_status.message, 'bot');
        }

        handleBotResponse(data.response, data);
      } catch (error) {
        removeTypingIndicator();
        appendMessage('Lo siento, hubo un error en la conexión. Por favor, intenta de nuevo.', 'bot');
        console.error(error);
      }
    }

    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;
      appendMessage(text, 'user');
      messageInput.value = '';
      clearInteractiveButtons();
      updateConversationState({ inactivityNotified: false });
      sendToBackend(text);
    }

    sendButton.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        sendMessage();
      }
    });

    function showDefaultActions() {
      showInteractiveButtons([
        { label: 'Ver vacantes', value: 'Quiero ver vacantes' },
        { label: 'Información de la empresa', value: 'Cuéntame sobre K83 FYC' },
        { label: 'Contacto', value: 'Contacto' }
      ]);
    }

    window.addEventListener('load', () => {
      renderProgress();
      setUploadButtonVisible(false);
      showInitialGreeting();
      resetInactivityTimer();
      updateDateTime();
      setInterval(updateDateTime, 60000);
    });
  </script>
</body>
</html>
